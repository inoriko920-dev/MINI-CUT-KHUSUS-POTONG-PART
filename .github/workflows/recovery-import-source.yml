name: Recovery Import Verified Source

on:
  push:
    branches:
      - recovery/source-r0

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/source-r0
          fetch-depth: 0

      - name: Import exact legacy source snapshot
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_REPO="https://github.com/tonitarung099-creator/Mini-Cut-Khusus-Potong-Part-.git"
          LEGACY_SHA="6d91b261f976574d106d12a943bbedb5c0527216"
          EXPECTED_TREE="040124052a3a974f1285f7cf6c0ff60aaff749b7"

          git config core.autocrlf false
          rm -rf /tmp/minicut-legacy
          git clone --no-tags "$LEGACY_REPO" /tmp/minicut-legacy
          git -C /tmp/minicut-legacy checkout --detach "$LEGACY_SHA"

          ACTUAL_SHA="$(git -C /tmp/minicut-legacy rev-parse HEAD)"
          ACTUAL_TREE="$(git -C /tmp/minicut-legacy rev-parse HEAD^{tree})"
          test "$ACTUAL_SHA" = "$LEGACY_SHA"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          git -C /tmp/minicut-legacy archive --format=tar "$LEGACY_SHA" | tar -xf - -C .

          git add -A
          EXTRACTED_TREE="$(git write-tree)"
          if [ "$EXTRACTED_TREE" != "$EXPECTED_TREE" ]; then
            echo "Tree mismatch: extracted=$EXTRACTED_TREE expected=$EXPECTED_TREE" >&2
            exit 1
          fi

          mkdir -p docs/recovery
          git -C /tmp/minicut-legacy ls-tree -r "$LEGACY_SHA" > docs/recovery/LEGACY_TREE_LS.txt
          cat > docs/recovery/RECOVERY_NOTES.md <<'EOF'
          # MiniCut Recovery R0

          Verified source was recovered from the accessible legacy repository:
          `tonitarung099-creator/Mini-Cut-Khusus-Potong-Part-`.

          Exact source baseline commit:
          `6d91b261f976574d106d12a943bbedb5c0527216`

          Exact legacy Git tree:
          `040124052a3a974f1285f7cf6c0ff60aaff749b7`

          The recovery workflow verified that the extracted source-only index produced the same Git tree SHA before recovery documentation was added.

          `MiniCut-Windows.zip` is build evidence only and is not used as a source substitute.
          EOF

          cat > docs/recovery/SOURCE_PROVENANCE.md <<'EOF'
          # Source Provenance

          | Scope | Provenance | Evidence |
          |---|---|---|
          | Legacy application source, tests, requirements, scripts and Windows workflow | VERIFIED_SOURCE | Legacy commit `6d91b261f976574d106d12a943bbedb5c0527216`, tree `040124052a3a974f1285f7cf6c0ff60aaff749b7` |
          | `MiniCut-Windows.zip` | VERIFIED_FROM_BUILD | SHA256 `addc5818fa819e8627fd1aff4bd3cf0ac019009c0b663d6b8b00447fbbc7a940` |
          | Recovery/history documentation | RECONSTRUCTED_FROM_DOCS | Audit and recovery handoffs dated 2026-10-01 |
          | Unknown SHA `545e1eb65081c46d35ce1197b1b26cc93637e953` | UNKNOWN | Mentioned in older recovery notes but not verified in the accessible legacy repository |
          EOF

          cat > docs/recovery/CURRENT_STATE.md <<'EOF'
          # Current State — Recovery R0

          Source recovery baseline: VERIFIED.

          The repository source snapshot is copied from legacy HEAD `6d91b261f976574d106d12a943bbedb5c0527216` and verified by exact Git tree SHA before adding recovery documentation.

          Test/build status must be updated only from commands or GitHub Actions that actually run on the recovered source.
          EOF

          cat > docs/recovery/KNOWN_MISSING_FILES.md <<'EOF'
          # Known Missing / Unknown

          No tracked file from the verified legacy tree is intentionally omitted from the recovered source snapshot.

          Historical Git metadata before R0 is not recreated in the new repository. The legacy commit/tree identifiers are preserved as provenance instead.

          SHA `545e1eb65081c46d35ce1197b1b26cc93637e953` remains UNKNOWN / UNVERIFIED and is not used as a baseline.
          EOF

          cat > docs/recovery/RECOVERY_TEST_STATUS.md <<'EOF'
          # Recovery Test Status

          - Exact source tree extraction against legacy tree: PASS in recovery importer before docs were added.
          - Python/unit/integration tests: PENDING recovered-source CI on `main`.
          - Windows portable build: PENDING recovered-source CI on `main`.
          - Local user Git bundle / restore drill: PENDING local clone; do not claim completed from cloud environment.
          EOF

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "recovery: import verified legacy source 6d91b26"
          git push origin HEAD:recovery/source-r0
